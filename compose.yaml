# DeepSeek Harness (dsh) - host-mounted container deployment
#
# Runtime services are split into three independently managed blocks:
#
#   dsh
#     AUTH_GATEWAY=false -> the first real *dsh-runtime service only
#     AUTH_GATEWAY=true  -> every real *dsh-runtime service
#
#   auth
#     Authelia + the nginx gateway. The gateway itself is the authenticated HTTP entry.
#
#   tls
#     Optional built-in HTTPS terminator. It always reaches the selected HTTP entry through
#     the runtime-network alias dsh-http-entry.
#
# The base file deliberately has no business HTTP ports. scripts/compose_mode.sh overlays
# HTTP_PORT:80 and the dsh-http-entry alias directly onto the selected real service:
#
#   AUTH_GATEWAY=false -> first dsh runtime instance (currently dsh-user)
#   AUTH_GATEWAY=true  -> gateway
#
# This conditional override adds no container and prevents authenticated mode from exposing a
# runtime directly. HTTPS_EXPORT is a Taskfile startup policy only; HTTP remains published in
# both HTTPS modes. Runtime blocks have no cross-block depends_on relationships.
#
# Fixed container names: base infrastructure (gateway/authelia/tls) runs as
# dsh-base-*, user runtime instances as dsh-web-<name> (generated by
# scripts/user_admin.sh), and the builder keeps dsh-deploy-builder.
name: deepseek-harness-deploy

# ------------------------------------------------------------ dsh runtime template
x-dsh-runtime: &dsh-runtime
  build:
    context: ./build
    dockerfile: Dockerfile.runtime
    args:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
  image: dsh-runtime:latest
  hostname: dsh-runtime
  restart: unless-stopped
  init: true
  profiles: [ "dsh" ]
  environment:
    TZ: ${TZ:-}
    DSH_HOME: /data/dsh-home
    DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    DSH_UID: ${HOST_UID:-1000}
    DSH_GID: ${HOST_GID:-1000}
  volumes:
    - &dsh-checkout ./deepseek-harness:/app/dsh:ro
  networks:
    - runtime

services:
  # ---------------------------------------------------------- authentication gateway
  # The mode override publishes HTTP_PORT:80 directly on this container when
  # AUTH_GATEWAY=true. With built-in or external TLS it receives X-Forwarded-Proto: https.
  gateway:
    image: nginx:1.31.3-alpine
    container_name: dsh-base-gateway
    restart: unless-stopped
    # nginx 镜像声明 STOPSIGNAL SIGQUIT(优雅关停): worker 会等待所有现存连接结束,
    # 而这里代理的是 SSE/WS 长连接(proxy_*_timeout 3600s)且未设 worker_shutdown_timeout,
    # 等待无上限 - 停止总要耗满 Docker 默认 10s 宽限期后被 SIGKILL(task down 因此慢
    # 约 20s)。整栈拆除时无需 drain, 改发 SIGTERM 让 nginx 快速关停, 与其他服务一致。
    stop_signal: SIGTERM
    profiles: [ "auth" ]
    environment:
      DSH_DOMAIN: ${DSH_DOMAIN:-harness.deepseek.com}
      # Browser-facing public HTTPS port. The gateway canonicalizes auth redirect targets to
      # https://DSH_DOMAIN[:HTTPS_PORT] so a visit arriving on the cleartext HTTP_PORT cannot
      # leak that port into the HTTPS redirect chain (rd / safe-redirection).
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./nginx/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - runtime

  # -------------------------------------------------------------------- authelia
  authelia:
    image: authelia/authelia:4.39.20
    container_name: dsh-base-authelia
    restart: unless-stopped
    profiles: [ "auth" ]
    command:
      - --config
      - /config/configuration.yml
      - --config.experimental.filters=template
    environment:
      DSH_DOMAIN: ${DSH_DOMAIN:-harness.deepseek.com}
      # Browser-side public HTTPS port. It belongs to the built-in TLS block when that block
      # is used, or to an external TLS terminator otherwise.
      HTTPS_PORT: ${HTTPS_PORT:-443}
      PUID: ${HOST_UID:-1000}
      PGID: ${HOST_GID:-1000}
    volumes:
      - ./authelia:/config
    networks:
      - runtime

  # ------------------------------------------------------------------------- tls
  # Independent built-in HTTPS export. It can start before dsh/auth and returns 502 until the
  # mode-selected service owns dsh-http-entry. Dynamic Docker DNS follows service recreation.
  tls:
    build:
      context: ./build
      dockerfile: Dockerfile.tls
    image: dsh-tls:latest
    container_name: dsh-base-tls
    restart: unless-stopped
    # 同 gateway: 覆盖镜像的 SIGQUIT, 避免长连接把停止拖到 10s 宽限期上限。
    stop_signal: SIGTERM
    profiles: [ "tls" ]
    ports:
      - "${HTTPS_PORT:-443}:443"
    environment:
      DSH_DOMAIN: ${DSH_DOMAIN:-harness.deepseek.com}
    volumes:
      - ./nginx/tls.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/tls-cert.sh:/docker-entrypoint.d/10-tls-cert.sh:ro
      - ./nginx/tls:/etc/nginx/tls
    healthcheck:
      # Local TLS liveness only; upstream readiness is intentionally decoupled.
      test: [ "CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1/healthz" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - runtime

  # This is currently the first real *dsh-runtime service and therefore the no-auth instance.
  # Add isolated users with `task user:create` (keeps Authelia, compose and gateway routing
  # in sync); see README「用户管理」.
  # ------------------------------------------------ dsh runtime instance: user
  dsh-user:
    <<: *dsh-runtime
    container_name: dsh-web-user
    volumes:
      - *dsh-checkout
      - ./dsh-home/user:/data/dsh-home
      - ./workspace/user:/data/workspace

  # ------------------------------------------- dsh runtime image (build-only pointer)
  # x-dsh-runtime is an extension, not a buildable service. This pointer owns image builds and
  # explicitly replaces the inherited dsh profile so it can never be started as an instance.
  dsh-runtime:
    <<: *dsh-runtime
    profiles: [ "build" ]

  # -------------------------------------------------------------- one-shot builder
  builder:
    build:
      context: ./build
      dockerfile: Dockerfile.builder
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: dsh-builder:latest
    container_name: dsh-deploy-builder
    restart: "no"
    profiles: [ "build" ]
    volumes:
      - ./deepseek-harness:/app/dsh
      - ./overrides/loopback-hostname.ts:/app/dsh/packages/client/connection/src/loopback-hostname.ts:ro
    networks:
      - builder

# One network per role. If BUILDER_NETWORK/RUN_NETWORK is set, Taskfile computes the matching
# *_EXTERNAL flag so Compose joins an existing network; otherwise Compose manages the named
# deployment networks and removes them during project-level down.
networks:
  builder:
    name: ${BUILDER_NETWORK:-deepseek-harness_builder}
    external: ${BUILDER_NETWORK_EXTERNAL:-false}
  runtime:
    name: ${RUN_NETWORK:-deepseek-harness_runtime}
    external: ${RUN_NETWORK_EXTERNAL:-false}
