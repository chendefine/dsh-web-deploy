# 'dsh web'(127.0.0.1:3080)前的 nginx 反代, 构建时原样 COPY 进镜像
# /etc/nginx/conf.d/dsh.conf(build/Dockerfile.runtime 步骤 4)。compose 不做
# 运行时挂载: 改动本文件需重建 runtime 镜像(task up / task build 会做)。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 静态资源缓存策略。
map $uri $dsh_static_cache {
    default                        "no-cache";
    ~*^/assets/                    "public, max-age=31536000, immutable";
    ~*^/plugins/.+/client\.js$     "public, max-age=31536000, immutable";
    /favicon.svg                   "public, max-age=86400";
    /manifest.webmanifest          "public, max-age=86400";
}

# 任意 Host 进来都重写 Host 为 loopback 并丢弃 Origin, 使 dsh 的 /api 信任防线
# 把所有来源视为 loopback。仅明文 HTTP; 外层仍可再前置 HTTPS/认证层。
server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host 127.0.0.1:3080;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 缓存接管(策略见上方 map): 丢弃上游 Node 的 Cache-Control(/plugins 的
        # no-cache), 按本层 map 重发。101(WebSocket 升级)响应浏览器忽略该头, 无害。
        proxy_hide_header Cache-Control;
        add_header Cache-Control $dsh_static_cache always;
    }
}
